# This is a drop-in rather than an edit to logind.conf, so a systemd update does
# not leave a .pacnew that must be reconciled manually.

[Login]
# The power button does NOT shut down immediately. The notch shutdown menu
# (Super+Shift+Q), which asks for confirmation, takes precedence. Long-pressing
# it does power off, as the usual emergency option.
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

# When the laptop is plugged in, closing the lid does not suspend: it is used as
# a desktop with the lid closed. On battery, normal behavior (suspend) remains.
HandleLidSwitchExternalPower=ignore
