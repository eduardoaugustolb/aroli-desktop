# Pacman mirrors, selected by reflector.timer once a week.
#
# This is the full file rather than a drop-in because reflector does not support
# them. When the package is updated, pacman will leave a .pacnew beside it.

--save /etc/pacman.d/mirrorlist
--protocol https

# Nearby countries, not the entire world: from here, a German mirror works well
# and an Australian one does not, no matter how up to date it is.
--country Spain,France,Germany,Portugal

# 15 rather than 5: with only five, if two are down updates become sluggish.
--latest 15

# By measured SPEED, not synchronization time. A freshly synchronized but slow
# mirror is useless.
--sort rate
