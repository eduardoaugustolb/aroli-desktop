# Boot login = the hyprlock island. Ships as a drop-in to avoid touching
# /etc/sddm.conf: deleting this file returns to the previous (silent) theme.

[Theme]
Current=hyprisland

[General]
# QML_XHR_ALLOW_FILE_READ=1 is not optional: without it Qt 6 SILENTLY blocks
# local file reads from QML (neither exception nor callback), and the
# island battery indicator stays empty forever.
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1
# The theme uses no virtual keyboard; silent's was leftover here.
InputMethod=
