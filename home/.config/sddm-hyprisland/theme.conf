[General]
# Starting point, not source of truth. Main.qml reads the live accent from
# /var/lib/sddm-hyprisland/accent, which login-sync.sh writes -as your user-
# every time the wallpaper changes. This here is what paints during the
# milliseconds that read takes, and the theme installer seeds it.
accent=#8cd8c2
# Fallback: only used when there is no background in /var/lib/sddm-hyprisland yet.
background=backgrounds/current.jpg

# Login language: es (default) or en. The installer writes it with
# ./install.sh --lang en. If missing, the theme comes up in Spanish.
language=pt-BR
