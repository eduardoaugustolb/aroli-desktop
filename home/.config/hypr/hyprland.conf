### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# --- Quickshell Settings app (SettingsWindow.qml) ---
# The only true window (xdg-toplevel) in the shell: class org.quickshell,
# title "Ajustes"; the rest of the shell is layers (layer-shell) and never
# passes through here. Without these rules it opened TILED at half screen
# (952x1038). Always floating, contained, centered. To dock it some day,
# Super+V undocks/docks by hand with no config changes.
# Size also lives in the QML (implicitWidth/Height) so no big flash precedes
# Hyprland resizing it. Never below 780 wide: the window has its own minimum
# there.
# NOTE the syntax: Hyprland 0.53 redid windowrules and the lifelong one
# ("windowrule = float, class:^(x)$") is NO LONGER valid — it errors "invalid
# field float: missing a value". Filters are now match:* fields and effects
# carry values. The commented example above is the old syntax.
windowrule {
    name = ajustes-quickshell
    match:class = ^(org\.quickshell)$
    match:title = ^(Settings)$

    float = true
    size = 900 620
    center = true
}

# --- Law 9: one animation, one owner ---
# The compositor animates surfaces that APPEAR; the app animates the inside.
#
# Quickshell's bar/notch is a PERMANENT layer that resizes itself
# and already animates itself (Appearance.qml tokens). If Hyprland animated it
# too, two animations would chain over the same gesture and smear. Command is
# yielded to Quickshell here.
layerrule = no_anim on, match:namespace ^(quickshell:bar)$

# --- Law 6 applied to shell surfaces: each enters from where it should,
# --- match, instead of one generic fade for all.
#
# Only possible since all three declare WlrLayershell.namespace (one
# line in each .qml). Before there was nothing to hold onto and they ate the
# global 'layers'.
#
# Each one's rule comes from law 9 (one animation, one owner): look at WHAT
# the app already animates inside and give the compositor only what is left
# free. If both animate the same thing, both fades multiply and the result is
# not twice as pretty, it arrives late.
#
# media: lives glued to the bottom edge, so it RISES from there. 'slide' moves
# position and nothing else -- no fade -- and the card inside already handles
# scale and opacity. Separate channels, no stepping on each other.
layerrule = animation slide bottom, match:namespace ^(quickshell:media)$

# wallpaper: covers the whole screen, so sliding it would show the edge
# it enters by. And besides, its 'stage' already fades alone (animMed,
# OutCubic). The compositor has nothing to add here: stand aside.
layerrule = no_anim on, match:namespace ^(quickshell:wallpaper)$

# overview: this rule was retired 6-Aug-2026 and must NOT come back.
# The overview is no longer its own surface: it is a notch face, living
# inside quickshell:bar, and its entry is the notch shape's own morph. A layer
# rule here would have nothing to apply to.

# Two layerrules lived here (blur + ignore_alpha 0.5) over the rofi layer, the
# only thing with real transparency. They leave with rofi 19-08-2026: a rule
# pointing at a layer nobody creates does nothing except make you believe rofi
# is still on the desktop.
# (In case a layer rule is ever needed again: the old positional syntax --
# "layerrule = blur, quickshell:bar" -- was broken not by 0.56 but by the 0.53
# rule rewrite; the good form today uses match:.)

# The shadow says "this is what you are looking at": ONLY the focused window
# casts it. Together with dim_inactive, focus stops being a nuance and becomes
# the first thing the eye sees entering the screen, without a single border
# line. (This used to be "floaters only", which in a tiling is almost never:
# the rule was right on paper and in practice never showed.)
windowrule = no_shadow on, match:focus 0



# pywal: wallpaper-dynamic borders (revert = comment out the source line)
source = ~/.cache/wal/colors-hyprland.conf

# Wallpaper picker with pywal re-theming (Super+Shift+W)

# --- Quick wins ---
bind = $mainMod CTRL, S, exec, ~/.config/hypr/scripts/screenshot-annotate.sh   # annotate the screenshot (satty)
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/colorpicker.sh          # colour picker (hyprpicker)
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/hyprsunset-toggle.sh    # night light toggle

# --- Signature: menu/ocr ---
bind = $mainMod ALT, Space, global, quickshell:actions   # command menu (the notch launcher's > mode)
bind = $mainMod CTRL, T, exec, ~/.config/hypr/scripts/ocr.sh              # screen OCR

# --- Screen recording (wf-recorder) ---
bind = $mainMod CTRL, R, exec, ~/.config/hypr/scripts/screenrecord.sh
