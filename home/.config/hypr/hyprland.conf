################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
#
# Deliberate WILDCARD rule: fits the laptop (eDP-1) and the
# tower (DP-4 + DP-6) alike with no changes. 'preferred' picks each output's
# native mode and 'auto' lays them right of one another in discovery order.
# Hardcoded names, never: they would only work on one of the two machines.
monitor=,preferred,auto,1

# To fine-tune one machine add NAMED rules below the wildcard
# (last one that fits wins). Names come from `hyprctl monitors`
# and position is the top-left corner in already-scaled pixels:
#
#   monitor=DP-4,preferred,0x0,1
#   monitor=DP-6,preferred,2560x0,1


