env = HYPRCURSOR_SIZE,19

# Mirror of hyprland.lua: hyprcursor OFF on purpose. The Bibata SVG theme
# is installed so shake-to-find zoom renders sharp, but if Hyprland also used
# it for the NORMAL cursor, that cursor would stop being the usual bitmap
# XCursor and show instantly. The plugin is patched to load the SVG on its
