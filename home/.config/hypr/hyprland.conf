# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    # Law 8 — a single gap across the content layer. 3/6 default: between
    # two windows 6 px (3 + 3) and to the screen edge 6 more — the same gap.
    # In this fallback .conf change by hand; in the .lua the Settings >
    # Appearance > Windows switch flips it live.
    gaps_in = 3
    gaps_out = 6

    # Law 2 — no border by default: focus is marked with light, not outline.
    # (Hyprland's factory teal/green colors lived here, contradicting the
    # whole palette and dead anyway because pywal stamps below. Out.)
    # Settings > Appearance > Windows flips it live in the .lua; in this
    # fallback .conf raise by hand to 2 for a pywal-themed outline.
    border_size = 0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    # Rounded window corners (hyprland.lua mirror). 12 = default;
    # 0 = square. If using this fallback .conf, change here by hand — the
    # Settings > Appearance > Windows switch only writes effects.lua,
    # which only hyprland.lua loads.
    rounding = 12
    rounding_power = 2.0

    # Law 2 — focus is marked with light. The focused window is FULLY
    # present; the rest sink. It used to sit at 0.98 active: a veil
    # communicating nothing while also stealing text contrast, because
    # kitty is already translucent on its own (background_opacity 0.95).
    # dim_inactive darkens instead of fading, the clean way for something
    # to recede: fading lets the background seep between letters.
    active_opacity = 1.0
    inactive_opacity = 0.90
    dim_inactive = true
    dim_strength = 0.35
    dim_special = 0.5

    # The shadow says "this floats". Tiled windows sit glued to the
    # grid and carry none (windowrule below); floating ones and
    # dialogs do. Information about the plane, not decoration.
    shadow {
        enabled = true
        range = 28
        render_power = 4
        # color: set by pywal (~/.cache/wal/colors-hyprland.conf)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    # At size 3 / passes 1 the blur never showed. What benefits is
    # what has real transparency: kitty runs at 0.95 opacity, and the
    # background shows through there. (This used to say "rofi menus"; none left.)
    # IF YOU NOTICE STUTTER: go back to size = 3 / passes = 1 (the old values).
    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.01
        vibrancy = 0.1696
        vibrancy_darkness = 0.2
        popups = true
    }

    # Law 5 — what CROSSES the screen leaves a trail. Hyprland 0.56 blurs
    # the window along its travel direction, while the animation lasts.
    # With rounding > 0 (default 12) both shaders exclude each other and
    # corners come out straight while traveling: compositor limit, not a bug.
    # 'samples' is the copies averaged along the path: more samples,
    # smoother trail and pricier. It does not lengthen the trail.
    #
    # NOTE, THIS FILE IS THE FALLBACK: the Settings > Appearance
    # > Effects switch writes effects.lua, which only hyprland.lua loads. If
    # you end up booting on this .conf, the switch does nothing and this line rules.
    motion_blur {
        enabled = true
        samples = 7
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
# ==========================================================================
#  MOTION. The full spec lives in ~/.config/motion-language.md
#  Speed runs in DECISECONDS: 1.3 = 130 ms. Literally the same
#  four numbers as the ~/.config/quickshell/Appearance.qml tokens, so
#  a window and the notch move on the same pulse.
#
#     RESPONSE  1.3 / 1.3    focus, zoom, border color
#     CONTENT   2.1 / 1.1    fades
#     PANEL     3.2 / 1.7    layers, moving windows
#     SHAPE     4.4 / 2.2    opening and closing a window
#     TRAVEL    5.0          what CROSSES the whole screen
#
#  If something moves here and is not on that scale, it is a bug.
#
#  TRAVEL is the exception: 500 ms, more than SHAPE, because crossing the
#  whole screen is literally the longest trip here and charging it at window-
#  opening price leaves it nothing.
#
#  IT USED TO SIT AT 7.0 WITH A 'frontal' curve (0.1,1)(0,1) copied from end-4,
#  on the theory a brutally front-loaded curve affords long durations. On
#  screen it never worked: it read as a yank followed by slow drift, and
#  Eduardo Augusto called it "weird". The lesson is such an extreme curve gives
#  not "fast AND weighty" but two glued gestures that never feel like the same
#  motion. Normal curve, honest duration.
# ==========================================================================
animations {
    enabled = yes

    # Three curves, and no more. The system's fourth ('entra', the bouncy
    # one) lives ONLY in Quickshell: everything moving here is big, and
    # by law 5 big things never bounce. A fullscreen bounce shows the
    # screen edge and gives away the trick.
    bezier = respuesta, 0.2,  0,    0,    1
    bezier = sale,      0.3,  0,    1,    1
    bezier = forma,     0.23, 1,    0.32, 1
    bezier = entra,     0.16, 1.3,  0.3,  1

    # 'apple': the iOS/macOS transition curve. Starts with a touch of
    # acceleration instead of shooting off -- that is what makes it feel like
    # something with mass getting going -- then brakes for nearly the whole
    # travel. The opposite of the 'frontal' tried before: that one packed 90%
    # of the trip into the first speck and the rest was drift.
    bezier = apple,     0.32, 0.72, 0,    1

    animation = global, 1, 3.2, forma

    # Law 6 — motion has an origin. A tiled window INFLATES in
    # its slot; it never flies in from an edge. The tiling already decided the
    # place, and flying in disproves it.
    animation = windows,     1, 4.4, entra, popin 78%
    animation = windowsIn,   1, 4.4, entra, popin 78%
    # Opening spans 22 scale points (78->100) and closing only 10 (100->90).
    # Deliberately asymmetric, not sloppy: opening is an event and deserves
    # gesture; closing is a discard and only has to get out of the way.
    # It used to close at 82%, nearly the same trip as opening, which is why
    # both felt too much alike.
    animation = windowsOut,  1, 2.2, sale,  popin 90%
    animation = windowsMove, 1, 4.4, forma # the live .lua uses the 'mover' spring at 4.4; here only the speed can mirror it

    animation = fade,       1, 2.1, forma
    animation = fadeIn,     1, 2.1, forma
    animation = fadeOut,    1, 1.1, sale
    animation = fadeSwitch, 1, 2.1, forma
    animation = fadeShadow, 1, 2.1, forma

    # Focus. With follow_mouse = 1 it shifts constantly, so dimming
    # must be RESPONSE: if it lagged, the whole desktop would shiver every
    # time you cross the mouse over a window.
    animation = fadeDim, 1, 1.3, respuesta

    # Layers (the bar and notch panels, launcher, notifications): they FADE.
    # Nothing fullscreen slides in; it would show the edge it enters by.
    animation = layers,        1, 3.2, forma, fade
    animation = layersIn,      1, 3.2, forma, fade
    animation = layersOut,     1, 1.7, sale,  fade
    animation = fadeLayersIn,  1, 3.2, forma
    animation = fadeLayersOut, 1, 1.7, sale

    # THE WORKSPACE SWITCH, MACOS STYLE. All the way: 'slide', not 'slidefade'.
    #
    # Got this wrong twice in a row, both times the same way. First slidefade
    # 30%, then "parallax" on top: the entering one 20% and the leaving 50%,
    # reasoning two planes at different depths give depth. On paper true. On
    # screen that percentage SHORTENS THE TRAVEL -- workspaces moved half a
    # span and a fade did the rest. That is why it looked subtle: not a weak
    # animation, almost no travel.
    #
    # macOS does none of that and that is why it feels punchy: both workspaces
    # sit glued like two adjoining rooms and the screen travels 100% from one
    # side to the other, together, with no fade at all. Fade is exactly what
    # gives away two superimposed images; without it, they are a place you
    # leave and one you arrive at.
    #
    # No bounce: it is a translation, and overshooting would leave a background
    # strip peeking on the far side right at the end.
    #
    animation = workspaces,    1, 5.0, apple, slide
    animation = workspacesIn,  1, 5.0, apple, slide
    animation = workspacesOut, 1, 5.0, apple, slide
    animation = specialWorkspace,    1, 5.0, apple, slidevert
    animation = specialWorkspaceIn,  1, 5.0, apple, slidevert
    animation = specialWorkspaceOut, 1, 5.0, apple, slidevert

    # Invisible (border_size = 0), but the node exists: so it never sits at
    # factory speed sounding off-key the day you switch borders on.
    animation = border, 1, 1.3, respuesta

    # borderangle / shadowangle / glowangle on 'loop' force continuous
    # repaint at 60 Hz even unseen. On an Iris Xe that is decoration paid in
    # frames. They stay off (law 7: nothing moves just because).

    animation = zoomFactor, 1, 1.3, respuesta
}


# --- Always three workspaces ---
# Hyprland destroys a workspace as soon as it sits empty, so the indicator
# row resized itself: closing the last window on 3 and the dot vanished.
# 'persistent' keeps them existing even empty.
#
# Done HERE and not by painting extra dots in the shell on purpose: this way
# the three workspaces truly exist, so the dot is clickable and takes you
# there. A painted dot matching nothing would be a lying decoration.
#
# They are a MINIMUM, not a cap: creating 4 (Super+4, or sending a window
# there) shows its dot alone, and it leaves when emptied. The first three
# always stay.
#
# WITH TWO SCREENS numbering stays session-wide: workspaces never duplicate
# per monitor. Hyprland hands each output one at boot and shares leftover
# persistents around, so Super+2 from the left screen can move FOCUS right.
# Stock behavior, not a bug, and the bar only paints ITS screen's workspaces.
# To split them by hand add the monitor (names from `hyprctl monitors`):
#   workspace = 1, persistent:true, monitor:DP-4
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # removed obsolete option: pseudotile = true
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(

    # From caelestia: STATE CHANGES animate, not live interaction.
    # Dragging or mouse-resizing already tracks your hand 1:1, so animating it
    # adds nothing and on an iGPU is continuous repaint tied to the pointer
    # (the priciest path there is). Not a shred of feel is lost and GPU frees
    # up exactly when most needed.
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    
}


