#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# UWSM exports the session environment to D-Bus and systemd.
# exec-once = waybar   # replaced by Quickshell's MenuBar.qml + Notch.qml
exec-once = ~/.config/hypr/awww-start.sh
# Quickshell (bar + notch) is supervised by quickshell.service: if it crashes, systemd raises it.
# Hypridle and the PolicyKit agent stay supervised by their user services.
exec-once = wl-paste --type text --watch cliphist store     # clipboard history (text)
exec-once = wl-paste --type image --watch cliphist store    # clipboard history (images)



