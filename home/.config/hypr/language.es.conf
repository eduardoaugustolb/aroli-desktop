# language.es.conf - lock-island text in Spanish.
#
# Nothing loads this file directly: the installer copies the applicable file
# (this one or language.en.conf) over language.conf, which hyprlock loads with
# `source` and scripts read through scripts/lang.sh.
#
# If you add a string here, add it to language.en.conf TOO and define its
# Spanish value in hyprlock.conf before `source`; that fallback preserves the
# lock screen if this file is missing.

$uiLang = es

$lockPlaceholder = Escribe tu contraseña
$lockCheck = Comprobando…
$lockFail = No coincide · intento $ATTEMPTS
