# hypridle - idle management (lock/display off/suspend)
# docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock        # Prevent multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session     # Lock BEFORE suspending.
    # Lua syntax (Hyprland 0.55+). Plain `dpms on` is a Lua syntax error and
    # hyprctl exits with code 7 without doing anything: the display would stay
    # BLACK after resuming. This is the most costly failure in this list because
    # it makes the laptop appear not to wake up.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'   # Turn on the display when waking.
    ignore_wayland_inhibit = false               # Respect Waybar's caffeine toggle.
}

# 5 min -> lower brightness (gentle warning that locking is imminent)
#
# The guard is necessary. A desktop has no internal panel, so it has no
# /sys/class/backlight - and brightnessctl WITHOUT A CLASS iterates classes in
# order (backlight, then leds) and uses the first with a device. Without this
# guard, after five idle minutes a desktop would turn off the Caps Lock LED and
# "restore" it on resume: an incomprehensible lock warning that changes keyboard state.
#
# Double protection: grep decides WHETHER to act and `-c backlight` decides
# WHAT to act on. `-l` lists every device with its class and exits 0 even when
# no backlight device exists, so grep matters, not the exit code. With a panel:
# the usual warning. Without a panel: nothing, silently.
listener {
    timeout = 300
    on-timeout = brightnessctl -l 2>/dev/null | grep -q "class 'backlight'" && brightnessctl -c backlight -s set 10%
    on-resume = brightnessctl -l 2>/dev/null | grep -q "class 'backlight'" && brightnessctl -c backlight -r
}

# 6 min -> lock the session
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# 7 min -> turn off the display
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 20 min -> suspend the system
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
