# hypridle - REMOTE MODE (enabled by ~/.local/bin/remote-mode)
# Differences from normal.conf:
#   - It STILL locks after 6 minutes (RustDesk captures hyprlock and allows
#     entering the password remotely, so keeping it accessible does not reduce
#     security).
#   - It does NOT turn off the display: with DPMS off, the compositor stops
#     rendering and the capture turns black.
#   - It does NOT suspend: a sleeping laptop cannot be reached remotely.

general {
    # Remote keeps hyprlock on purpose (sync-lock-preferences.sh is gone with
    # the session migration; hyprlock defaults are enough for remote unlock).
    lock_cmd = hyprctl dispatch dpms on; pgrep -x hyprlock >/dev/null || exec hyprlock --immediate-render
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_wayland_inhibit = false
}

# 6 min -> lock the session (can be unlocked remotely)
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}
