source = ~/.cache/wal/colors-hyprlock.conf

# Generated immediately before hyprlock starts. It keeps the lock's display
# type aligned with the font selected in Settings > Appearance; this fallback
# makes the screen independent from the cache on a first boot.
$lockFont = Adwaita Sans
source = ~/.cache/wal/lock-preferences.conf

# ── language ──────────────────────────────────────────────────────────────
# The three strings are defined HERE in English, then the `source` below
# overrides them when a language file exists. This order is deliberate: a
# `source` that cannot find its file logs an error and hyprlock continues
# ("Proceeding ignoring faulty entries"), so at worst the lock screen is in
# English instead of showing blank labels. No other failure mode is acceptable:
# this screen separates Eduardo Augusto from his own computer.
#
# The installer writes the file (./install.sh --lang en) by copying
# language.en.conf or language.es.conf over language.conf.
$lockPlaceholder = Enter your password
$lockCheck = Checking…
$lockFail = No match · attempt $ATTEMPTS
source = ~/.config/hypr/language.conf
# hyprlock - lock island, in the same visual language as Quickshell.
# The surface remains black; pywal supplies the accent when the wallpaper changes.

general {
    # A visible cursor gives feedback that the lock surface owns the input;
    # the password field still captures keyboard input automatically.
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = softOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 1.8, softOut
    animation = fadeOut, 1, 1.4, softOut
    animation = inputFieldColors, 1, 1.3, softOut
    animation = inputFieldDots, 1, 2.1, softOut
}

# The wallpaper is still the personal part of Noctis. The threshold only dims
# it enough to make the authentication surface legible on every palette.
background {
    monitor =
    path = /home/eduardoaugustolb/.cache/wal/lockbg
    blur_passes = 2
    blur_size = 4
    noise = 0.008
    contrast = 0.92
    brightness = 0.58
    vibrancy = 0.10
    vibrancy_darkness = 0.05
}

# ── THRESHOLD ─────────────────────────────────────────────────────────────
# A horizontal night band is the lock screen's distinctive structure. It is
# deliberately wider than any monitor: the same threshold crosses ultrawide,
# laptop and multi-monitor layouts instead of becoming another floating card.
shape {
    monitor =
    size = 10000, 214
    color = $surface
    rounding = 0
    border_size = 0
    shadow_passes = 2
    shadow_size = 24
    shadow_color = $shadow
    shadow_boost = 1.1
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# The two hairlines carry the wallpaper-derived accent without tinting the
# Umbra surface itself. They are the screen-wide counterpart of the shell's
# notch edge.
shape {
    monitor =
    size = 10000, 1
    color = $accent
    rounding = 0
    border_size = 0
    position = 0, 107
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 10000, 1
    color = $accent
    rounding = 0
    border_size = 0
    position = 0, -107
    halign = center
    valign = center
    zindex = 1
}

# There is intentionally no second card inside the threshold. A lock screen
# with a card inside a band reads as two unrelated dialogs and breaks at some
# fractional scales. The input is the only raised interactive surface.
#
# Time is information, not the hero. Tabular numerals keep its rhythm stable.
label {
    monitor =
    text = <span font_features="tnum">$TIME</span>
    font_size = 38
    font_family = $lockFont
    color = $text
    position = 0, 39
    halign = center
    valign = center
    zindex = 2
}

# Date follows the rice language, never the process locale.
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-info.sh date
    font_size = 12
    font_family = $lockFont
    color = $muted
    position = 0, 10
    halign = center
    valign = center
    zindex = 2
}

# The one interactive element gets the full accent. Status colors remain fixed
# so the wallpaper palette can never change the meaning of success or failure.
input-field {
    monitor =
    size = 382, 44
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.38
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surfaceAlt
    font_color = $text
    font_family = $lockFont
    fade_on_empty = false
    placeholder_text = <span alpha="55%">$lockPlaceholder</span>
    check_color = $ok
    check_text = $lockCheck
    fail_color = $fail
    fail_text = $lockFail
    capslock_color = $warn
    rounding = -1
    shadow_passes = 1
    shadow_size = 8
    shadow_color = $shadow
    position = 0, -37
    halign = center
    valign = center
    zindex = 2
}

# Identity and battery anchor the two ends of the aperture without competing
# with authentication. The mono face connects them to the status bar.
label {
    monitor =
    text = 󰀄  $USER
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    color = $dim
    position = -180, -78
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh battery
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    color = $dim
    position = 180, -78
    halign = center
    valign = center
    zindex = 2
}
