source = ~/.cache/wal/colors-hyprlock.conf

# ── language ──────────────────────────────────────────────────────────────
# The three strings are defined HERE in English, then the `source` below
# overrides them when a language file exists. This order is deliberate: a
# `source` that cannot find its file logs an error and hyprlock continues
# ("Proceeding ignoring faulty entries"), so at worst the lock screen is in
# English instead of showing blank labels. No other failure mode is acceptable:
# this screen separates Eduardo Augusto from his own computer.
#
# The installer writes the file (./install.sh --lang en) by copying
# language.en.conf or language.es.conf over language.conf.
$lockPlaceholder = Enter your password
$lockCheck = Checking…
$lockFail = No match · attempt $ATTEMPTS
source = ~/.config/hypr/language.conf
# hyprlock - lock island, in the same visual language as Quickshell.
# The surface remains black; pywal supplies the accent when the wallpaper changes.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = softOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3.2, softOut
    animation = fadeOut, 1, 2.1, softOut
    animation = inputFieldColors, 1, 1.3, softOut
    animation = inputFieldDots, 1, 2.1, softOut
}

# The background follows the current wallpaper. It is softened just enough to
# separate the island without erasing the image that governs the desktop aesthetic.
background {
    monitor =
    path = /home/eduardoaugustolb/.cache/wal/lockbg
    blur_passes = 2
    blur_size = 4
    noise = 0.008
    contrast = 0.92
    brightness = 0.68
    vibrancy = 0.14
    vibrancy_darkness = 0.05
}

# A single surface, like the control center opened by the notch.
shape {
    monitor =
    size = 520, 340
    color = $surface
    rounding = 32
    border_size = 1
    border_color = $outline
    shadow_passes = 3
    shadow_size = 18
    shadow_color = $shadow
    shadow_boost = 1.1
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Lock medallion: the wallpaper accent appears here and in the input field.
shape {
    monitor =
    size = 42, 42
    color = $surfaceAlt
    rounding = -1
    border_size = 1
    border_color = $accent
    position = 0, 130
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = 󰌾
    font_size = 17
    font_family = JetBrains Mono Nerd Font
    color = $accent
    position = 0, 130
    halign = center
    valign = center
    zindex = 2
}

# Clock: proportional like the notch, with stable tabular numerals.
label {
    monitor =
    text = <span font_features="tnum">$TIME</span>
    font_size = 68
    font_family = Adwaita Sans
    color = $text
    position = 0, 58
    halign = center
    valign = center
    zindex = 2
}

# Date in Spanish regardless of the session's global locale.
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-info.sh date
    font_size = 15
    font_family = Adwaita Sans
    color = $muted
    position = 0, 4
    halign = center
    valign = center
    zindex = 2
}

# Pill-shaped field: active by default; when validating or failing, it changes
# to colors that retain their meaning even when pywal produces another palette.
input-field {
    monitor =
    size = 360, 50
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.38
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surfaceAlt
    font_color = $text
    font_family = Adwaita Sans
    fade_on_empty = false
    placeholder_text = <span alpha="55%">$lockPlaceholder</span>
    check_color = $ok
    check_text = $lockCheck
    fail_color = $fail
    fail_text = $lockFail
    capslock_color = $warn
    rounding = -1
    shadow_passes = 1
    shadow_size = 8
    shadow_color = $shadow
    position = 0, -58
    halign = center
    valign = center
    zindex = 2
}

# Island footer: identity on the left and battery on the right.
label {
    monitor =
    text = 󰀄  $USER
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    color = $dim
    position = -154, -124
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh battery
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    color = $dim
    position = 154, -124
    halign = center
    valign = center
    zindex = 2
}
